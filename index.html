<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mes tonneaux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<!-- Client MQTT pour navigateur (WebSocket chiffré) et création de fichiers .zip -->
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<!--
  Console du parc de tonneaux — page unique, sans serveur.
  Elle se connecte au même serveur MQTT (EMQX Cloud Serverless) que les tonneaux, en
  WebSocket chiffré (port 8084, chemin /mqtt), avec l'identifiant « console ».
  Rien de secret n'est écrit dans ce fichier : il peut être publié sur GitHub Pages.

  Sujets MQTT (voir console.h dans le firmware) : tonneaux/<id>/en_ligne, etat,
  cmd, reponse, fichier/<nom>/<morceau>/<total>.
  Les versions sont lues sur GitHub (Releases du dépôt choisi dans Mises à jour).
-->
<style>
  :root{
    --noir:#0a0908; --panneau:#121110; --creme:#f2ece0; --creme-att:#b9b0a0; --gris:#8a8275;
    --ambre:#c8863a; --ambre-clair:#e0a862; --ligne:rgba(242,236,224,0.12); --ligne-douce:rgba(242,236,224,0.08);
    --vert:#6fae7d; --rouge:#d9695a; --rouge-clair:#e8806f; --bleu:#8fa3b8;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--noir); color:var(--creme); font-family:'Inter',sans-serif; font-size:14px; }
  a{ color:var(--ambre-clair); }
  button,input,select,textarea{ font-family:'Inter',sans-serif; }
  button{ cursor:pointer; }
  button:disabled{ cursor:not-allowed; opacity:.5; }
  h1,h2{ font-family:'Fraunces',serif; font-weight:500; margin:0; }
  h1{ font-size:32px; }
  h2{ font-size:20px; }
  main{ max-width:1100px; margin:0 auto; padding:40px 32px 56px; display:flex; flex-direction:column; gap:24px; }
  .ligne-titre{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; }
  .marque{ display:flex; align-items:center; gap:14px; }
  .actions-haut{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  .att{ color:var(--creme-att); }
  .petit{ font-size:12.5px; }
  .gris{ color:var(--gris); }
  .panneau{ background:var(--panneau); border:1px solid var(--ligne); border-radius:18px; padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
  .btn{ border-radius:999px; padding:11px 18px; font-weight:600; font-size:13.5px; border:1px solid rgba(242,236,224,0.2); background:transparent; color:var(--creme); text-decoration:none; text-align:center; }
  .btn.principal{ background:var(--ambre); color:var(--noir); border:0; font-weight:700; }
  .btn.discret{ color:var(--creme-att); border-color:var(--ligne); }
  .btn.danger{ background:var(--rouge); color:var(--noir); border:0; font-weight:700; }
  .btn.ambre{ color:var(--ambre-clair); border-color:rgba(224,168,98,0.45); }
  .lien{ background:none; border:0; color:var(--ambre-clair); font-weight:600; font-size:13px; padding:0; }
  .badge{ flex-shrink:0; display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; font-weight:600; font-size:13px; border:1px solid var(--ligne); }
  .badge .point{ width:8px; height:8px; border-radius:50%; }
  .badge.ok{ color:var(--vert); border-color:rgba(111,174,125,0.45); } .badge.ok .point{ background:var(--vert); }
  .badge.off{ color:var(--gris); } .badge.off .point{ background:var(--gris); }
  .grille-cartes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
  .carte{ background:var(--panneau); border:1px solid var(--ligne); border-radius:18px; padding:22px; display:flex; flex-direction:column; gap:18px; }
  .carte h2 button{ all:unset; cursor:pointer; font-family:'Fraunces',serif; font-size:24px; }
  .tuiles{ display:flex; gap:10px; }
  .tuile{ flex:1; border:1px solid var(--ligne-douce); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .tuile .lib{ font-size:12px; color:var(--creme-att); }
  .tuile .val{ font-weight:600; }
  dl{ margin:0; display:flex; flex-direction:column; gap:10px; font-size:13.5px; }
  dl div{ display:flex; justify-content:space-between; gap:12px; }
  dt{ color:var(--creme-att); } dd{ margin:0; text-align:right; }
  .rangee-boutons{ display:flex; flex-wrap:wrap; gap:10px; margin-top:auto; }
  .rangee-boutons .btn.principal{ flex-grow:1; }
  .icone{ width:46px; height:46px; display:flex; align-items:center; justify-content:center; background:transparent; color:var(--creme-att); border:1px solid rgba(242,236,224,0.15); border-radius:50%; }
  .confirmation{ display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:12px; }
  .confirmation.rouge{ border:1px solid rgba(217,105,90,0.45); background:rgba(217,105,90,0.07); }
  .confirmation.ambre{ border:1px solid rgba(224,168,98,0.45); background:rgba(224,168,98,0.08); }
  .confirmation .rangee{ display:flex; gap:8px; } .confirmation .rangee .btn{ flex:1; }
  .vide{ margin:0; padding:40px; text-align:center; color:var(--creme-att); border:1px dashed rgba(242,236,224,0.15); border-radius:18px; line-height:1.6; }
  .colonnes{ display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start; }
  .col-large{ flex:999 1 520px; min-width:0; display:flex; flex-direction:column; gap:22px; }
  .col-etroite{ flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:22px; }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .stat{ background:var(--panneau); border:1px solid var(--ligne); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:4px; }
  .stat .lib{ font-size:12px; color:var(--creme-att); } .stat .val{ font-weight:600; font-size:17px; } .stat .sous{ font-size:12px; color:var(--gris); }
  .ligne-info{ display:flex; justify-content:space-between; gap:12px; font-size:13.5px; }
  .ligne-info span:first-child{ color:var(--creme-att); }
  .barre{ height:8px; border-radius:999px; background:rgba(242,236,224,0.08); overflow:hidden; display:flex; }
  .legende{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .legende div{ display:flex; align-items:center; gap:8px; } .legende .carre{ width:9px; height:9px; border-radius:3px; } .legende .nom{ flex-grow:1; color:var(--creme-att); }
  .separateur{ height:1px; background:var(--ligne-douce); }
  .cartes-donnees{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .carte-donnee{ background:var(--noir); border:1px solid rgba(242,236,224,0.1); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:16px; }
  .gros{ font-family:'Fraunces',serif; font-size:28px; }
  .champ{ display:flex; flex-direction:column; gap:6px; flex:1 1 220px; }
  .champ label{ font-size:13px; color:var(--creme-att); }
  input[type=text],input[type=password],select{ background:var(--noir); color:var(--creme); border:1px solid rgba(242,236,224,0.2); border-radius:12px; padding:11px 13px; font-size:15px; }
  .alerte{ padding:14px 18px; border-radius:14px; border:1px solid rgba(217,105,90,0.45); background:rgba(217,105,90,0.08); line-height:1.5; }
  .alerte.info{ border-color:rgba(224,168,98,0.4); background:rgba(224,168,98,0.06); }
  ol.journal{ list-style:none; margin:0; padding:0; }
  ol.journal li{ display:flex; gap:14px; padding:9px 0; border-bottom:1px solid rgba(242,236,224,0.06); }
  ol.journal .heure{ color:var(--gris); width:48px; flex-shrink:0; font-variant-numeric:tabular-nums; }
  .version{ display:flex; flex-wrap:wrap; align-items:flex-start; gap:14px; padding:14px; border-radius:12px; border:1px solid var(--ligne-douce); }
  .ligne-tonneau{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; padding:13px 14px; border-radius:12px; border:1px solid var(--ligne-douce); }
  .connexion{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
  .connexion form{ width:100%; max-width:420px; background:var(--panneau); border:1px solid var(--ligne); border-radius:20px; padding:36px 32px; display:flex; flex-direction:column; gap:16px; }
  .etat-connexion{ font-size:12.5px; color:var(--creme-att); display:flex; align-items:center; gap:8px; }
  .etat-connexion .point{ width:8px; height:8px; border-radius:50%; background:var(--gris); }
  .etat-connexion.ok .point{ background:var(--vert); }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1c1a17; border:1px solid var(--ligne); color:var(--creme); padding:12px 18px; border-radius:12px; max-width:90vw; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .masque{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (max-width:600px){ main{ padding:24px 16px 40px; } h1{ font-size:26px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
'use strict';

// =============================================================================
// ÉTAT DE LA PAGE
// =============================================================================
const S = {
  client: null,             // client MQTT
  connecte: false,
  erreurConnexion: '',
  vue: { ecran: 'parc' },   // parc | tonneau (id) | versions
  tonneaux: {},             // id -> { etat, enLigne, vuLe (ms), journal: [] }
  masques: lire('masques', []), // tonneaux retirés de la liste
  fichiers: {},             // id|nom -> { morceaux: [], total, recus }
  attenteLogos: {},         // id -> { reste, fichiers: [] }
  confirmation: null,       // id du tonneau dont la confirmation (retirer / redémarrer) est ouverte
  edition: false,           // renommage ouvert sur la fiche
  depot: lire('depot', ''), // propriétaire/dépôt GitHub des versions
  versions: [],             // releases GitHub
  erreurVersions: '',
  choixVersion: {}          // id -> nom de version choisie
};

function lire(cle, defaut){ try{ const v = localStorage.getItem('console.' + cle); return v === null ? defaut : JSON.parse(v); }catch(e){ return defaut; } }
function ecrire(cle, valeur){ try{ localStorage.setItem('console.' + cle, JSON.stringify(valeur)); }catch(e){} }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = s => document.querySelector(s);

let minuteurToast = null;
function avis(texte){
  const t = $('#toast');
  t.textContent = texte; t.hidden = false;
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { t.hidden = true; }, 3500);
}

// =============================================================================
// MISE EN FORME
// =============================================================================
const NOMS_ETATS = { init:'Au repos', choix:'Verre posé', remplissage:'Service en cours', fin:'Service terminé',
  maintenance:'Maintenance', amorcage:'Amorçage', rincage:'Rinçage', veille:'Veille (interrupteur OFF)' };
const NOMS_MODES = { sta:'Wi-Fi du lieu', mixte:'Point d’accès + Wi-Fi Internet', ap:'Point d’accès seul', secours:'Point d’accès (secours)' };

function octets(n){
  if (n == null) return '—';
  if (n >= 1048576) return (n / 1048576).toFixed(1).replace('.', ',') + ' Mo';
  if (n >= 1024) return Math.round(n / 1024) + ' Ko';
  return n + ' o';
}
function heure(ms){ return new Date(ms).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }); }
function dateHeure(ms){
  const d = new Date(ms), auj = new Date();
  const jour = d.toDateString() === auj.toDateString() ? 'aujourd’hui'
    : d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
  return jour + ', ' + heure(ms);
}
function depuis(ms){
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 10) return 'À l’instant';
  if (s < 60) return 'Il y a ' + s + ' s';
  if (s < 3600) return 'Il y a ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'Il y a ' + Math.round(s / 3600) + ' h';
  return 'Il y a ' + Math.round(s / 86400) + ' j';
}
function signal(rssi){
  if (!rssi) return '—';
  return (rssi >= -60 ? 'Bon' : rssi >= -75 ? 'Correct' : 'Faible') + ' (' + rssi + ' dBm)';
}
// Instant de la dernière connexion connue : message reçu pendant que la page est
// ouverte, sinon l'heure écrite par le tonneau dans son dernier état.
function derniereConnexion(t){
  if (t.enLigne && t.vuLe) return t.vuLe;
  if (t.etat && t.etat.t) return t.etat.t * 1000;
  return t.vuLe || null;
}

// Adresse du serveur EMQX (pas secrète : sans le mot de passe « console », personne n'entre).
const SERVEUR_PAR_DEFAUT = 'n9766717.ala.eu-central-1.emqxsl.com';

// =============================================================================
// MQTT
// =============================================================================
function seConnecter(hote, utilisateur, motDePasse){
  if (S.client) S.client.end(true);
  S.erreurConnexion = '';
  const client = mqtt.connect('wss://' + hote + ':8084/mqtt', {
    username: utilisateur,
    password: motDePasse,
    clientId: 'console-' + Math.random().toString(16).slice(2, 10),
    clean: true,
    reconnectPeriod: 5000,
    connectTimeout: 15000
  });
  S.client = client;

  client.on('connect', () => {
    S.connecte = true;
    S.erreurConnexion = '';
    client.subscribe(['tonneaux/+/etat', 'tonneaux/+/en_ligne', 'tonneaux/+/reponse', 'tonneaux/+/fichier/#'], { qos: 1 });
    if (S.vue.ecran === 'connexion') S.vue = { ecran: 'parc' };
    rendre();
  });
  client.on('close', () => { S.connecte = false; rendre(); });
  client.on('error', (e) => {
    S.erreurConnexion = /auth|Not authorized|Bad user/i.test(e.message) ? 'Identifiant ou mot de passe refusé.' : ('Connexion impossible : ' + e.message);
    if (/auth|Not authorized|Bad user/i.test(e.message)) { client.end(true); S.client = null; S.vue = { ecran: 'connexion' }; }
    rendre();
  });
  client.on('message', recevoir);
}

function envoyer(id, commande){
  if (!S.client || !S.connecte){ avis('Pas connecté à la console.'); return false; }
  S.client.publish('tonneaux/' + id + '/cmd', JSON.stringify(commande), { qos: 1 });
  return true;
}

function tonneau(id){
  if (!S.tonneaux[id]) S.tonneaux[id] = { etat: null, enLigne: false, vuLe: null, journal: [] };
  return S.tonneaux[id];
}

function journaliser(id, texte){
  const t = tonneau(id);
  t.journal.unshift({ ms: Date.now(), texte });
  t.journal.length = Math.min(t.journal.length, 30);
}

function recevoir(sujet, message){
  const parties = sujet.split('/');
  if (parties[0] !== 'tonneaux' || parties.length < 3) return;
  const id = parties[1], type = parties[2];

  if (type === 'fichier'){ recevoirMorceau(id, parties.slice(3), message); return; }

  const texte = new TextDecoder().decode(message);
  // Message vide conservé = tonneau retiré de la console
  if (texte === ''){ if (type === 'etat') delete S.tonneaux[id]; rendrePlusTard(); return; }
  const t = tonneau(id);

  if (type === 'en_ligne'){
    const avant = t.enLigne;
    t.enLigne = texte === '1';
    if (t.enLigne) t.vuLe = Date.now();
    if (avant !== t.enLigne && t.etat) journaliser(id, t.enLigne ? 'Connecté à la console' : 'Déconnecté de la console');
  }
  else if (type === 'etat'){
    try{ t.etat = JSON.parse(texte); }catch(e){ return; }
    if (t.enLigne) t.vuLe = Date.now();
    if (S.masques.includes(id) && t.enLigne){ S.masques = S.masques.filter(x => x !== id); ecrire('masques', S.masques); }
  }
  else if (type === 'reponse'){
    let r; try{ r = JSON.parse(texte); }catch(e){ return; }
    traiterReponse(id, r);
  }
  rendrePlusTard();
}

function traiterReponse(id, r){
  const nom = (tonneau(id).etat || {}).nom || id;
  if (r.type === 'fichier'){
    S.fichiers[id + '|' + r.nom] = { morceaux: new Array(r.morceaux), total: r.morceaux, recus: 0, taille: r.taille };
    return;
  }
  if (r.type === 'logos'){
    if (!r.nb){ avis(nom + ' : aucun logo importé.'); delete S.attenteLogos[id]; return; }
    S.attenteLogos[id] = { reste: r.nb, fichiers: [] };
    avis(nom + ' : réception de ' + r.nb + ' logo(s)…');
    return;
  }
  if (r.action){
    const messages = { renommer:'Nom enregistré', redemarrer:'Redémarrage', maj:'Mise à jour', exporter:'Export', logos:'Logos' };
    const lib = messages[r.action] || r.action;
    const texte = r.ok ? (r.message ? lib + ' : ' + r.message : lib) : (lib + ' — erreur : ' + (r.message || '?'));
    journaliser(id, texte);
    avis(nom + ' — ' + texte);
  }
}

function recevoirMorceau(id, chemin, donnees){
  // chemin = [nom, morceau, total]
  if (chemin.length < 3) return;
  const nom = chemin[0], index = parseInt(chemin[1], 10), total = parseInt(chemin[2], 10);
  const cle = id + '|' + nom;
  let f = S.fichiers[cle];
  if (!f){ f = S.fichiers[cle] = { morceaux: new Array(total), total, recus: 0 }; }
  if (!f.morceaux[index]){ f.morceaux[index] = new Uint8Array(donnees); f.recus++; }
  if (f.recus < f.total) return;
  delete S.fichiers[cle];
  const blob = new Blob(f.morceaux, { type: nom.endsWith('.json') ? 'application/json' : 'image/png' });
  const attente = S.attenteLogos[id];
  if (attente && nom.endsWith('.png')){
    attente.fichiers.push({ nom, blob });
    attente.reste--;
    if (attente.reste <= 0){ delete S.attenteLogos[id]; zipperLogos(id, attente.fichiers); }
    return;
  }
  telecharger(blob, nomFichier(id, nom));
  avis('Fichier reçu : ' + nom);
}

async function zipperLogos(id, fichiers){
  const zip = new JSZip();
  fichiers.forEach(f => zip.file(f.nom, f.blob));
  const blob = await zip.generateAsync({ type: 'blob' });
  telecharger(blob, nomFichier(id, 'logos.zip'));
  avis(fichiers.length + ' logo(s) téléchargé(s).');
}

function nomFichier(id, nom){
  const t = tonneau(id), base = ((t.etat && t.etat.nom) || id).replace(/[^\w\-]+/g, '_');
  return base + '_' + nom;
}

function telecharger(blob, nom){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// Retirer un tonneau : on efface ses messages conservés sur le serveur, et on le
// masque. S'il est encore allumé et connecté, il réapparaît à son prochain état.
function retirer(id){
  if (S.client && S.connecte){
    S.client.publish('tonneaux/' + id + '/etat', '', { qos: 1, retain: true });
    S.client.publish('tonneaux/' + id + '/en_ligne', '', { qos: 1, retain: true });
  }
  delete S.tonneaux[id];
  if (!S.masques.includes(id)){ S.masques.push(id); ecrire('masques', S.masques); }
  S.confirmation = null;
  if (S.vue.ecran === 'tonneau') S.vue = { ecran: 'parc' };
  rendre();
}

// =============================================================================
// VERSIONS (GitHub Releases)
// =============================================================================
async function chargerVersions(){
  S.erreurVersions = '';
  if (!/^[\w.-]+\/[\w.-]+$/.test(S.depot)){ S.versions = []; rendre(); return; }
  try{
    const r = await fetch('https://api.github.com/repos/' + S.depot + '/releases?per_page=20', { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(r.status === 404 ? 'dépôt introuvable (il doit être public)' : 'GitHub a répondu ' + r.status);
    const liste = await r.json();
    S.versions = liste.filter(v => !v.draft).map(v => {
      const fichier = n => (v.assets || []).find(a => a.name === n);
      const fw = fichier('firmware.bin'), fs = fichier('littlefs.bin');
      return {
        nom: v.tag_name || v.name,
        notes: (v.body || '').trim(),
        date: v.published_at ? new Date(v.published_at).getTime() : null,
        firmware: fw ? { url: fw.browser_download_url, sha256: (fw.digest || '').replace(/^sha256:/, ''), taille: fw.size } : null,
        fs: fs ? { url: fs.browser_download_url, sha256: (fs.digest || '').replace(/^sha256:/, ''), taille: fs.size } : null
      };
    });
  }catch(e){ S.versions = []; S.erreurVersions = 'Versions illisibles : ' + e.message; }
  rendre();
}

function derniereVersion(){ return S.versions.find(v => v.firmware && v.firmware.sha256) || null; }

function installer(id, nomVersion){
  const v = S.versions.find(x => x.nom === nomVersion);
  if (!v || !v.firmware){ avis('Cette version n’a pas de firmware.bin.'); return; }
  if (!v.firmware.sha256 || (v.fs && !v.fs.sha256)){ avis('Empreinte SHA-256 absente sur GitHub : version refusée.'); return; }
  const cmd = { action: 'maj', version: v.nom, firmware: { url: v.firmware.url, sha256: v.firmware.sha256 } };
  if (v.fs) cmd.fs = { url: v.fs.url, sha256: v.fs.sha256 };
  if (envoyer(id, cmd)) journaliser(id, 'Mise à jour vers ' + v.nom + ' demandée');
}

let rendreEnAttente = false;
function rendrePlusTard(){
  if (rendreEnAttente) return;
  rendreEnAttente = true;
  requestAnimationFrame(() => { rendreEnAttente = false; rendre(); });
}

function listeTonneaux(){
  return Object.entries(S.tonneaux)
    .filter(([id, t]) => t.etat && !S.masques.includes(id))
    .sort((a, b) => String(a[1].etat.nom).localeCompare(String(b[1].etat.nom), 'fr'));
}

function rendreVersions(){
  const liste = listeTonneaux();
  const derniere = derniereVersion();
  const noms = S.versions.filter(v => v.firmware).map(v => v.nom);
  const lignes = liste.map(([id, t]) => {
    const e = t.etat;
    const choix = S.choixVersion[id] || (derniere ? derniere.nom : '');
    const aJour = derniere && e.version === derniere.nom;
    const statut = e.maj_en_attente ? `<span style="color:var(--ambre-clair);font-weight:600">${esc(e.maj_en_attente)} en attente du repos</span>`
      : !t.enLigne ? '<span class="gris" style="font-weight:600">Hors ligne</span>'
      : aJour ? '<span style="color:var(--vert);font-weight:600">À jour</span>'
      : derniere ? `<span class="att" style="font-weight:600">${esc(derniere.nom)} disponible</span>` : '';
    return `<div class="ligne-tonneau">
      <span style="font-weight:600;min-width:110px">${esc(e.nom)}</span>
      <span class="att" style="flex:1 1 140px">Installée : <strong style="color:var(--creme)">${esc(e.version)}</strong></span>
      <span style="flex:1 1 200px;font-size:13px">${statut}</span>
      <label class="att petit" style="display:flex;align-items:center;gap:8px">Installer
        <select data-choix-version="${esc(id)}" style="padding:8px 10px;font-size:13px">${noms.map(n => `<option ${n === choix ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
      <button class="btn" data-installer="${esc(id)}" data-version-choisie ${t.enLigne && noms.length ? '' : 'disabled'} style="padding:9px 14px">OK</button>
    </div>`;
  }).join('');

  return `<main>
    <button class="lien" data-aller="parc" style="align-self:flex-start">← Mes tonneaux</button>
    <div><h1 style="font-size:34px">Mises à jour</h1><p class="att" style="margin:6px 0 0">Les versions viennent des « Releases » de ton dépôt GitHub. Un tonneau s’installe la version au prochain moment de repos, puis redémarre.</p></div>

    <section class="panneau">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
        <h2 style="flex-grow:1">Tonneaux</h2>
        <button class="btn principal" id="tout-installer" ${derniere && liste.length ? '' : 'disabled'}>Installer ${derniere ? esc(derniere.nom) : 'la dernière version'} sur tous</button>
      </div>
      ${lignes || '<p class="att" style="margin:0">Aucun tonneau.</p>'}
    </section>

    <section class="panneau">
      <h2>Versions</h2>
      <form id="form-depot" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
        <div class="champ"><label for="depot">Dépôt GitHub (public) qui contient les versions</label><input id="depot" type="text" placeholder="ton-compte/tonneaux-versions" value="${esc(S.depot)}" autocapitalize="off" spellcheck="false"></div>
        <button class="btn" type="submit">Actualiser</button>
      </form>
      ${S.erreurVersions ? `<div class="alerte">${esc(S.erreurVersions)}</div>` : ''}
      ${S.versions.map((v, i) => `<div class="version">
        <div style="flex:1 1 380px;display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><strong style="font-size:15px">${esc(v.nom)}</strong>
            ${v === derniere ? '<span class="badge" style="padding:2px 9px;font-size:12px;color:var(--ambre-clair);border-color:var(--ambre-clair)">La plus récente</span>' : ''}</div>
          <span style="color:#d8d0c2;line-height:1.5;white-space:pre-line">${esc(v.notes || 'Pas de description.')}</span>
          <span class="gris petit">${v.date ? dateHeure(v.date) + ' · ' : ''}${v.firmware ? 'programme ' + octets(v.firmware.taille) : '<span style="color:var(--rouge-clair)">firmware.bin manquant</span>'}${v.fs ? ' · pages du site ' + octets(v.fs.taille) : ''}${v.firmware && !v.firmware.sha256 ? ' · <span style="color:var(--rouge-clair)">empreinte absente</span>' : ''}</span>
        </div></div>`).join('') || (S.depot && !S.erreurVersions ? '<p class="att" style="margin:0">Aucune version publiée.</p>' : '')}
    </section>

    <section class="panneau">
      <h2>Publier une nouvelle version</h2>
      <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:#d8d0c2;line-height:1.5">
        <li>Dans <code>console_config.h</code>, augmente <code>VERSION_FIRMWARE</code> (par exemple <code>v1.9.1</code>).</li>
        <li>Dans PlatformIO : <strong>Build</strong> (et <strong>Build Filesystem Image</strong> si les pages du site ont changé).</li>
        <li>Sur GitHub, dans ton dépôt : <strong>Releases › Draft a new release</strong>, tag = le même numéro (<code>v1.9.1</code>), et dépose
          <code>.pio/build/esp32-s3/firmware.bin</code> (et <code>littlefs.bin</code>). Écris ce qui change, puis <strong>Publish release</strong>.</li>
        <li>Reviens ici et clique sur <strong>Actualiser</strong>.</li>
      </ol>
    </section>
  </main>`;
}

function rendre(){
  const app = $('#app');
  // Ne pas redessiner pendant une saisie (renommage, dépôt) : on perdrait le texte.
  const actif = document.activeElement;
  if (actif && app.contains(actif) && (actif.tagName === 'INPUT' || actif.tagName === 'SELECT')) return;
  if (!S.client || S.vue.ecran === 'connexion'){ app.innerHTML = rendreConnexion(); return; }
  if (S.vue.ecran === 'tonneau') app.innerHTML = rendreTonneau(S.vue.id);
  else if (S.vue.ecran === 'versions') app.innerHTML = rendreVersions();
  else app.innerHTML = rendreParc();
  document.title = S.vue.ecran === 'versions' ? 'Mises à jour' : 'Mes tonneaux';
}

document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'form-connexion'){
    const hote = $('#c-hote').value.trim().replace(/^.*:\/\//, '').replace(/[:/].*$/, '');
    const utilisateur = $('#c-util').value.trim();
    ecrire('acces', $('#c-memo').checked ? { hote, utilisateur } : {});
    if (document.activeElement) document.activeElement.blur();
    S.vue = { ecran: 'parc' };
    seConnecter(hote, utilisateur, $('#c-mdp').value);
    rendre();
  }
  else if (f.id === 'form-renommer'){
    const id = S.vue.id, nom = $('#r-nom').value.trim(), lieu = $('#r-lieu').value.trim();
    if (!nom) return;
    if (envoyer(id, { action: 'renommer', nom, lieu })){
      const t = S.tonneaux[id]; if (t && t.etat){ t.etat.nom = nom; t.etat.lieu = lieu; }
    }
    S.edition = false;
    document.activeElement.blur();
    rendre();
  }
  else if (f.id === 'form-depot'){
    S.depot = $('#depot').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '');
    ecrire('depot', S.depot);
    document.activeElement.blur();
    chargerVersions();
  }
});

document.addEventListener('change', (ev) => {
  const sel = ev.target.closest('[data-choix-version]');
  if (sel){ S.choixVersion[sel.dataset.choixVersion] = sel.value; sel.blur(); }
});

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (b.id === 'deconnexion'){ if (S.client) S.client.end(true); S.client = null; S.connecte = false; S.tonneaux = {}; S.vue = { ecran: 'connexion' }; rendre(); return; }
  if (b.id === 'tout-installer'){
    const v = derniereVersion(); if (!v) return;
    let n = 0, horsLigne = 0;
    listeTonneaux().forEach(([id, t]) => {
      if (t.etat.version === v.nom) return;
      if (!t.enLigne){ horsLigne++; return; }
      installer(id, v.nom); n++;
    });
    avis(n + ' tonneau(x) mis à jour vers ' + v.nom + ' au prochain moment de repos' +
      (horsLigne ? ' · ' + horsLigne + ' hors ligne : à relancer quand ils seront connectés.' : '.'));
    return;
  }
  if (d.aller){ S.vue = { ecran: d.aller }; S.confirmation = null; S.edition = false; if (d.aller === 'versions') chargerVersions(); rendre(); window.scrollTo(0, 0); return; }
  if (d.ouvrir){ S.vue = { ecran: 'tonneau', id: d.ouvrir }; S.confirmation = null; S.edition = false; envoyer(d.ouvrir, { action: 'etat' }); if (!S.versions.length && S.depot) chargerVersions(); rendre(); window.scrollTo(0, 0); return; }
  if (d.confirmer){ S.confirmation = d.confirmer; rendre(); return; }
  if (d.annuler !== undefined){ S.confirmation = null; rendre(); return; }
  if (d.retirer){ retirer(d.retirer); return; }
  if (d.redemarrer){ if (envoyer(d.redemarrer, { action: 'redemarrer' })) journaliser(d.redemarrer, 'Redémarrage demandé'); S.confirmation = null; rendre(); return; }
  if (d.editer !== undefined){ S.edition = true; rendre(); setTimeout(() => { const c = $('#r-nom'); if (c) c.focus(); }, 0); return; }
  if (d.finEdition !== undefined){ S.edition = false; document.activeElement.blur(); rendre(); return; }
  if (d.exporter){ if (envoyer(d.exporter, { action: 'exporter' })) avis('Demande envoyée au tonneau…'); return; }
  if (d.logos){ if (envoyer(d.logos, { action: 'logos' })) avis('Demande envoyée au tonneau…'); return; }
  if (d.installer){
    const version = d.versionChoisie !== undefined ? (S.choixVersion[d.installer] || (derniereVersion() || {}).nom) : d.version;
    installer(d.installer, version);
    avis('Mise à jour vers ' + version + ' envoyée : installation au prochain moment de repos.');
    return;
  }
});

// Rafraîchit les « Il y a … » toutes les 15 s
setInterval(rendrePlusTard, 15000);

// Démarrage : on rouvre directement la connexion si l'adresse est mémorisée ? Non :
// le mot de passe n'est jamais enregistré, il est redemandé à chaque visite.
S.vue = { ecran: 'connexion' };
rendre();
</script>
